<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新北高中圖書館 小工具</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#fff; --ink:#22262b; --muted:#6b7078; --line:#e3dfd6;
    --accent:#2f6b4f; --accent-soft:#e6efe9; --soon:#9a8f7a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 20px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  h1{font-size:28px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);margin:4px 0 0;font-size:15px}
  .search{flex:0 1 280px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:14px;background:#fff}
  .search:focus{outline:2px solid var(--accent);outline-offset:1px}
  section{margin-top:28px}
  h2{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 12px;letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  a.card,div.card{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:18px;text-decoration:none;color:inherit;transition:transform .12s, box-shadow .12s, border-color .12s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(40,40,30,.08);border-color:#cfc9bc}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card.soon{opacity:.65;border-style:dashed}
  .ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
       display:grid;place-items:center}
  .card.soon .ico{background:#eee9df;color:var(--soon)}
  .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .body{min-width:0}
  .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
  .name .arrow{color:var(--muted);font-weight:400;font-size:14px}
  .desc{color:var(--muted);font-size:14px;margin:2px 0 8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;padding:1px 8px;border-radius:999px;background:#f1eee7;color:#5d5a52}
  .tag.warn{background:#fdf0dc;color:#8a5a12}
  .empty{color:var(--muted);padding:20px 0}
  footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">新北高中圖書館 小工具</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <input class="search" id="q" type="search" placeholder="搜尋工具…" aria-label="搜尋工具">
  </header>
  <main id="list"><p class="empty">載入中…</p></main>
  <footer>工具清單維護於 <code>tools.json</code>。</footer>
</div>

<script>
(function(){
  var ICONS = {
    book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M6 17h13"/>',
    wifi:'<path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8"/>',
    clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h3"/>',
    device:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    form:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z"/>',
    link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
  };
  var data = null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function icon(k){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||ICONS.link)+'</svg>'; }

  function card(t){
    var tags = (t.tags||[]).map(function(g){ return '<span class="tag'+(/需|限/.test(g)?' warn':'')+'">'+esc(g)+'</span>'; }).join('');
    var inner = '<div class="ico">'+icon(t.icon)+'</div><div class="body"><div class="name">'+esc(t.name)
      + (t.soon||!t.url ? '' : '<span class="arrow">↗</span>') + '</div><div class="desc">'+esc(t.desc)+'</div><div class="tags">'+tags+'</div></div>';
    if(t.soon || !t.url) return '<div class="card soon">'+inner+'</div>';
    return '<a class="card" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+inner+'</a>';
  }

  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var html = '';
    data.sections.forEach(function(s){
      var tools = s.tools.filter(function(t){
        return !q || (t.name+' '+t.desc+' '+(t.tags||[]).join(' ')+' '+s.name).toLowerCase().indexOf(q) > -1;
      });
      if(!tools.length) return;
      html += '<section><h2>'+esc(s.name)+'</h2><div class="grid">'+tools.map(card).join('')+'</div></section>';
    });
    document.getElementById('list').innerHTML = html || '<p class="empty">找不到符合的工具。</p>';
  }

  fetch('tools.json?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    data = d;
    if(d.site){
      if(d.site.title){ document.getElementById('title').textContent = d.site.title; document.title = d.site.title; }
      if(d.site.subtitle) document.getElementById('subtitle').textContent = d.site.subtitle;
    }
    render();
  }).catch(function(){
    document.getElementById('list').innerHTML = '<p class="empty">工具清單載入失敗，請重新整理頁面。</p>';
  });
  document.getElementById('q').addEventListener('input', function(){ if(data) render(); });
})();
</script>
</body>
</html>
